<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="compute-method-environment-en-title compute-method-environment-en-desc">
  <title id="compute-method-environment-en-title">Compute, Methods, and Infrastructure: Two Complementary Views</title>
  <desc id="compute-method-environment-en-desc">A conceptual illustration: compute budgets feed search and learning to produce results requiring evaluation; hardware and software affect both the compute a budget can buy and the usable compute and experimental costs available to a method.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #202630; letter-spacing: 0; }
      .heading { font-size: 32px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .detail { font-size: 16px; fill: #626b78; }
      .note { font-size: 16px; fill: #626b78; }
      .node { fill: #ffffff; stroke: #dfe3e9; stroke-width: 2; }
      .focal { fill: #edf2fc; stroke: #2459d3; stroke-width: 2; }
      .flow { fill: none; stroke: #626b78; stroke-width: 2; }
      .influence { fill: none; stroke: #626b78; stroke-width: 2; stroke-dasharray: 8 4; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#626b78"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2459d3"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2459d3"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f8f9fb"/>
  <text class="heading" x="40" y="56">How does compute deliver results?</text>
  <text class="detail" x="40" y="92">Examine both the scaling mechanism and the conditions that enable it.</text>
  <text class="note" x="40" y="120">Sutton: how methods use additional computation</text>

  <path class="flow" d="M224 196 H288" marker-end="url(#arrow)"/>
  <path class="flow" d="M544 196 H608" marker-end="url(#arrow)"/>
  <path class="flow" d="M400 412 H464" marker-end="url(#arrow)"/>
  <path class="influence" d="M132 356 V252" marker-end="url(#arrow)"/>
  <path class="influence" d="M592 356 V312 Q592 304 584 304 H424 Q416 304 416 296 V252" marker-end="url(#arrow)"/>

  <rect x="152" y="280" width="208" height="28" fill="#f8f9fb"/>
  <text class="note" x="160" y="300">What can the budget buy?</text>
  <rect x="432" y="268" width="152" height="24" fill="#f8f9fb"/>
  <text class="note" x="440" y="288">Efficiency and fit</text>

  <rect class="node" x="40" y="140" width="184" height="112" rx="8"/>
  <text class="label" x="132" y="176" text-anchor="middle">Compute budget</text>
  <text class="detail" x="132" y="208" text-anchor="middle">Training / inference</text>
  <text class="detail" x="132" y="236" text-anchor="middle">Attempts / time</text>

  <rect class="focal" x="288" y="140" width="256" height="112" rx="8"/>
  <text class="label" x="416" y="176" text-anchor="middle">Search and learning</text>
  <text class="detail" x="416" y="208" text-anchor="middle">Explore / learn from experience</text>
  <text class="detail" x="416" y="236" text-anchor="middle">Mechanisms for using compute</text>

  <rect class="node" x="608" y="140" width="312" height="112" rx="8"/>
  <text class="label" x="764" y="176" text-anchor="middle">Observed outcomes</text>
  <text class="detail" x="764" y="208" text-anchor="middle">Success rate / time / cost</text>
  <text class="detail" x="764" y="236" text-anchor="middle">Require checks and comparisons</text>

  <text class="note" x="624" y="340">Hooker: access to computing</text>
  <rect class="node" x="40" y="356" width="360" height="112" rx="8"/>
  <text class="label" x="64" y="396">Hardware and software</text>
  <text class="detail" x="64" y="428">Chips / memory / compilers / libraries</text>
  <text class="detail" x="64" y="452">Implementation effort and trial opportunities</text>

  <rect class="node" x="464" y="356" width="456" height="112" rx="8"/>
  <text class="label" x="488" y="396">Usable computation</text>
  <text class="detail" x="488" y="428">Throughput / memory access / trial cost</text>
  <text class="detail" x="488" y="452">Measure operations and runtime separately</text>

  <text class="detail" x="40" y="508">More budget helps only when mechanisms, implementation, and evaluation work together.</text>
  <path d="M40 536 H920" stroke="#dfe3e9" stroke-width="2"/>
  <text class="note" x="40" y="564">Solid: compute path. Dashed: environment influence. Conceptual only; no effect estimates.</text>
  <text class="note" x="40" y="588">Engineering interpretation of Sutton (2019) and Hooker (2020).</text>
</svg>
