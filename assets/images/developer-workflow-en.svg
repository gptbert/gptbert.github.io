<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="developer-workflow-en-title developer-workflow-en-desc"><title id="developer-workflow-en-title">From requirements to delivery</title><desc id="developer-workflow-en-desc">Requirements define behavior, implementation produces changes, verification gathers evidence, and delivery states support and limits. Failed verification returns to implementation.</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#202630}.secondary{fill:#626b78}.edge{fill:none;stroke:#626b78;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#626b78"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2459d3"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2459d3"/></marker></defs><rect width="960" height="600" fill="#f8f9fb"/><text x="40" y="48" font-size="28" font-weight="600">From requirements to delivery</text><text x="40" y="80" font-size="20" class="secondary">A working feature needs a complete path to everyday use.</text><path class="edge" d="M560 192V224"/><path class="edge" d="M560 304V336"/><path class="edge" d="M560 416V448"/><path class="edge" stroke-dasharray="6 4" d="M200 376H144Q136 376 136 368V272Q136 264 144 264H200"/><rect x="200" y="112" width="720" height="80" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="224" y="136" font-size="12" class="secondary">01</text><text x="224" y="168" font-size="24" font-weight="600">Requirements</text><path d="M400 128V176" stroke="#dfe3e9"/><text x="424" y="144" font-size="20">Which behavior should users get?</text><text x="424" y="172" font-size="16" class="secondary">Output: scope and acceptance criteria</text><rect x="200" y="224" width="720" height="80" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="224" y="248" font-size="12" class="secondary">02</text><text x="224" y="280" font-size="24" font-weight="600">Implementation</text><path d="M400 240V288" stroke="#dfe3e9"/><text x="424" y="256" font-size="20">How will the behavior work?</text><text x="424" y="284" font-size="16" class="secondary">Output: reviewable code and checks</text><rect x="200" y="336" width="720" height="80" rx="8" fill="#edf2fc" stroke="#2459d3"/><text x="224" y="360" font-size="12" class="secondary">03</text><text x="224" y="392" font-size="24" font-weight="600">Verification</text><path d="M400 352V400" stroke="#dfe3e9"/><text x="424" y="368" font-size="20">What does the evidence establish?</text><text x="424" y="396" font-size="16" class="secondary">Output: results and unverified items</text><rect x="200" y="448" width="720" height="80" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="224" y="472" font-size="12" class="secondary">04</text><text x="224" y="504" font-size="24" font-weight="600">Delivery</text><path d="M400 464V512" stroke="#dfe3e9"/><text x="424" y="480" font-size="20">Who can use it, and under what conditions?</text><text x="424" y="508" font-size="16" class="secondary">Output: package, limits and recovery guidance</text><path d="M40 548H920" stroke="#dfe3e9"/><path d="M40 576H88" stroke="#626b78" stroke-width="2" stroke-dasharray="6 4"/><text x="104" y="580" font-size="16" class="secondary">Dashed return: revise after failed checks, then verify again.</text></svg>