<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="developer-workflow-title developer-workflow-desc"><title id="developer-workflow-title">从需求到交付</title><desc id="developer-workflow-desc">需求明确行为，实现形成改动，验证取得证据，交付说明适用条件与边界。验证未通过时返回实现并重新验证。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#202630}.secondary{fill:#626b78}.edge{fill:none;stroke:#626b78;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#626b78"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2459d3"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2459d3"/></marker></defs><rect width="960" height="600" fill="#f8f9fb"/><text x="40" y="48" font-size="28" font-weight="600">从需求到交付</text><text x="40" y="80" font-size="20" class="secondary">让功能走进日常使用，每个阶段都要留下明确的结果。</text><path class="edge" d="M560 192V224"/><path class="edge" d="M560 304V336"/><path class="edge" d="M560 416V448"/><path class="edge" stroke-dasharray="6 4" d="M200 376H144Q136 376 136 368V272Q136 264 144 264H200"/><rect x="200" y="112" width="720" height="80" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="224" y="136" font-size="12" class="secondary">01</text><text x="224" y="168" font-size="24" font-weight="600">需求</text><path d="M400 128V176" stroke="#dfe3e9"/><text x="424" y="144" font-size="20">用户应该得到什么行为？</text><text x="424" y="172" font-size="16" class="secondary">留下：范围与验收条件</text><rect x="200" y="224" width="720" height="80" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="224" y="248" font-size="12" class="secondary">02</text><text x="224" y="280" font-size="24" font-weight="600">实现</text><path d="M400 240V288" stroke="#dfe3e9"/><text x="424" y="256" font-size="20">怎样让这些行为发生？</text><text x="424" y="284" font-size="16" class="secondary">留下：可审查的代码与检查</text><rect x="200" y="336" width="720" height="80" rx="8" fill="#edf2fc" stroke="#2459d3"/><text x="224" y="360" font-size="12" class="secondary">03</text><text x="224" y="392" font-size="24" font-weight="600">验证</text><path d="M400 352V400" stroke="#dfe3e9"/><text x="424" y="368" font-size="20">证据具体证明了什么？</text><text x="424" y="396" font-size="16" class="secondary">留下：验证结果与未验项</text><rect x="200" y="448" width="720" height="80" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="224" y="472" font-size="12" class="secondary">04</text><text x="224" y="504" font-size="24" font-weight="600">交付</text><path d="M400 464V512" stroke="#dfe3e9"/><text x="424" y="480" font-size="20">谁能用，能用到哪里？</text><text x="424" y="508" font-size="16" class="secondary">留下：安装包、限制与恢复说明</text><path d="M40 548H920" stroke="#dfe3e9"/><path d="M40 576H88" stroke="#626b78" stroke-width="2" stroke-dasharray="6 4"/><text x="104" y="580" font-size="16" class="secondary">虚线返回：验证未通过，修改实现后重新验证。</text></svg>