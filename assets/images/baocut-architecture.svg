<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="baocut-architecture-title baocut-architecture-desc"><title id="baocut-architecture-title">BaoCut 系统架构</title><desc id="baocut-architecture-desc">桌面、CLI、MCP 和 Web 客户端连接本地 Runtime。Runtime 编排智能体、模型与计算任务；视频修改统一经过 Rust Engine Host，由 VideoStore 保存。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#202630}.sub{font-size:16px;fill:#626b78}.name{font-size:20px;font-weight:600}.tag{font-size:12px;fill:#626b78;letter-spacing:1px}.edge{fill:none;stroke:#626b78;stroke-width:1.2;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#626b78"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2459d3"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2459d3"/></marker></defs><rect width="960" height="600" fill="#f8f9fb"/><text x="40" y="48" font-size="28" font-weight="600">BaoCut 系统架构</text><text x="40" y="76" class="sub">统一入口 · 任务编排 · 视频单写</text><path class="edge" d="M280 176H344"/><path class="edge" d="M616 176H680" stroke-dasharray="4 4"/><path class="edge" d="M480 240V328"/><path class="edge" d="M400 240V264Q400 272 392 272H168Q160 272 160 280V328"/><path class="edge" d="M560 240V288Q560 296 568 296H792Q800 296 800 304V328"/><path class="edge" d="M480 432V480"/><rect x="40" y="112" width="240" height="128" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="56" y="140" class="name">客户端入口</text><text x="56" y="168" class="sub">Desktop · CLI · MCP · Web</text><text x="56" y="192" class="sub">桌面 / Web：WASM 预览</text><rect x="344" y="112" width="272" height="128" rx="8" fill="#edf2fc" stroke="#2459d3"/><text x="360" y="140" class="name">本地 Node Runtime</text><text x="360" y="168" class="sub">Agent Harness · Video · Models</text><text x="360" y="192" class="sub">鉴权 / 策略 / Jobs / 工具</text><rect x="680" y="112" width="240" height="128" rx="8" fill="#ffffff" stroke="#dfe3e9" stroke-dasharray="4 4"/><text x="696" y="140" class="name">智能体引擎</text><text x="696" y="168" class="sub">Codex CLI · Claude Code</text><text x="696" y="192" class="sub">驱动适配与会话</text><rect x="40" y="328" width="240" height="104" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="56" y="356" class="name">模型执行与服务</text><text x="56" y="384" class="sub">本地推理 / 在线 API</text><text x="56" y="408" class="sub">转写 / 语音 / 图像等</text><rect x="344" y="328" width="272" height="104" rx="8" fill="#edf2fc" stroke="#2459d3"/><text x="360" y="356" class="name">Rust Engine Host</text><text x="360" y="384" class="sub">视频事务 / 回执 / 撤销</text><text x="360" y="408" class="sub">视频唯一写入方</text><rect x="680" y="328" width="240" height="104" rx="8" fill="#ffffff" stroke="#dfe3e9"/><text x="696" y="356" class="name">媒体与动效执行</text><text x="696" y="384" class="sub">原生渲染 / 导出 worker</text><text x="696" y="408" class="sub">Code Runtime：动效烘焙</text><rect x="344" y="480" width="272" height="64" rx="8" fill="#f0f3f8" stroke="#626b78"/><text x="360" y="508" class="name">VideoStore</text><rect x="336" y="292" width="132" height="24" fill="#f8f9fb"/><text x="340" y="308" class="sub">视频命令</text><rect x="492" y="444" width="132" height="24" fill="#f8f9fb"/><text x="496" y="460" class="sub">持久化</text><path d="M40 560H920" stroke="#dfe3e9"/><text x="40" y="584" font-size="12" fill="#626b78">概览：连线表示调用或写入方向；省略返回事件、监管进程和 Runtime 元数据存储。</text></svg>