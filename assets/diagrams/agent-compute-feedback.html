<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 如何把新增计算转化为可验收的结果</title>
  <style>
    body { margin: 0; background: #f8f9fb; }
    svg { display: block; width: 100%; max-width: 960px; height: auto; margin: 0 auto; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="agent-compute-feedback-title agent-compute-feedback-desc">
  <title id="agent-compute-feedback-title">Agent 的候选、执行、反馈与验收流程</title>
  <desc id="agent-compute-feedback-desc">明确任务和预算后，生成候选并执行取证；验收通过时交付结果，未通过时根据证据修正。预算内继续尝试，预算耗尽时保留证据并转人工接管。此流程反馈不等于跨任务持续学习。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #202630; letter-spacing: 0; }
      .heading { font-size: 32px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 600; }
      .detail { font-size: 20px; fill: #626b78; }
      .note { font-size: 16px; fill: #626b78; }
      .node { fill: #ffffff; stroke: #dfe3e9; stroke-width: 2; }
      .focal { fill: #edf2fc; stroke: #2459d3; stroke-width: 2; }
      .flow { fill: none; stroke: #626b78; stroke-width: 2; }
      .return { fill: none; stroke: #626b78; stroke-width: 2; stroke-dasharray: 8 4; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#626b78"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2459d3"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2459d3"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f8f9fb"/>
  <text class="heading" x="40" y="56">让计算带来可验收的进步</text>
  <text class="detail" x="40" y="92">扩大探索范围，同时保留反馈、验收与预算边界</text>

  <path class="flow" d="M240 172 H312" marker-end="url(#arrow)"/>
  <path class="flow" d="M576 172 H672" marker-end="url(#arrow)"/>
  <path class="flow" d="M796 220 V248" marker-end="url(#arrow)"/>
  <path class="flow" d="M672 328 H576" marker-end="url(#arrow)"/>
  <path class="return" d="M444 284 V220" marker-end="url(#arrow)"/>
  <path class="flow" d="M444 372 V424" marker-end="url(#arrow)"/>
  <path class="flow" d="M796 408 V520 Q796 528 788 528 H148 Q140 528 140 520 V372" marker-end="url(#arrow)"/>

  <rect x="592" y="292" width="64" height="24" fill="#f8f9fb"/>
  <text class="note" x="624" y="312" text-anchor="middle">未通过</text>
  <rect x="464" y="240" width="144" height="24" fill="#f8f9fb"/>
  <text class="note" x="472" y="260">预算内再尝试</text>
  <rect x="464" y="388" width="112" height="24" fill="#f8f9fb"/>
  <text class="note" x="472" y="408">预算耗尽</text>
  <rect x="816" y="436" width="64" height="24" fill="#f8f9fb"/>
  <text class="note" x="824" y="456">通过</text>

  <rect class="node" x="40" y="124" width="200" height="96" rx="8"/>
  <text class="label" x="140" y="164" text-anchor="middle">任务与预算</text>
  <text class="detail" x="140" y="196" text-anchor="middle">输入与验收标准</text>

  <rect class="node" x="312" y="124" width="264" height="96" rx="8"/>
  <text class="label" x="444" y="164" text-anchor="middle">生成候选</text>
  <text class="detail" x="444" y="196" text-anchor="middle">探索不同方案</text>

  <rect class="node" x="672" y="124" width="248" height="96" rx="8"/>
  <text class="label" x="796" y="164" text-anchor="middle">执行与取证</text>
  <text class="detail" x="796" y="196" text-anchor="middle">测试 · 日志 · 工具</text>

  <path class="focal" d="M796 248 L920 328 L796 408 L672 328 Z"/>
  <text class="label" x="796" y="336" text-anchor="middle">验收通过？</text>

  <rect class="focal" x="312" y="284" width="264" height="88" rx="8"/>
  <text class="label" x="444" y="320" text-anchor="middle">反馈与修正</text>
  <text class="detail" x="444" y="352" text-anchor="middle">证据改变后续行动</text>

  <rect class="node" x="40" y="284" width="200" height="88" rx="8"/>
  <text class="label" x="140" y="320" text-anchor="middle">交付结果</text>
  <text class="detail" x="140" y="352" text-anchor="middle">记录完整成本</text>

  <rect class="node" x="312" y="424" width="264" height="72" rx="8"/>
  <text class="label" x="444" y="456" text-anchor="middle">人工接管</text>
  <text class="detail" x="444" y="484" text-anchor="middle">保留证据与失败记录</text>

  <path d="M40 552 H920" stroke="#dfe3e9" stroke-width="2"/>
  <text class="note" x="40" y="576">虚线：在预算内根据反馈重试　｜　本文工程示意，并非两篇原文的实验结果</text>
  <text class="note" x="40" y="596">本次任务的反馈不等于持续学习；跨任务学习需要保存并利用经验。</text>
</svg>
</body>
</html>
