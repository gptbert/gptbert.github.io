<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title and page.title != '首页' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} RSS" href="{{ '/feed.xml' | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳转到正文</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="gptbert 首页">gptbert<span aria-hidden="true">.</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a{% if page.url == '/' %} aria-current="page"{% endif %} href="{{ '/' | relative_url }}">首页</a>
        <a{% if page.url == '/posts/' or page.layout == 'post' %} aria-current="page"{% endif %} href="{{ '/posts/' | relative_url }}">文章</a>
        <a{% if page.url == '/projects/' %} aria-current="page"{% endif %} href="{{ '/projects/' | relative_url }}">项目</a>
        <a{% if page.url == '/about/' %} aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">关于</a>
      </nav>
    </div>
  </header>

  <main id="main" class="shell main-content">{{ content }}</main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <div>
        <a class="brand footer-brand" href="{{ '/' | relative_url }}">gptbert<span aria-hidden="true">.</span></a>
        <p>写代码，也记录过程。</p>
      </div>
      <nav aria-label="页脚导航">
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <a href="https://github.com/gptbert">GitHub</a>
        <a href="{{ '/support.html' | relative_url }}">技术支持</a>
        <a href="{{ '/privacy.html' | relative_url }}">隐私政策</a>
      </nav>
    </div>
  </footer>
</body>
</html>
