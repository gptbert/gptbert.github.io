---
layout: default
---
<article class="article">
  <a class="back-link" href="{{ '/posts/' | relative_url }}">← 返回全部文章</a>
  <header class="article-header">
    <p class="eyebrow">文章 · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y 年 %m 月 %d 日' }}</time></p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <div class="article-end">
    <span>感谢阅读。</span>
    <a href="{{ '/posts/' | relative_url }}">继续浏览文章 →</a>
  </div>
</article>
