name: Check public content policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public source
        run: node --test tests/content-policy.test.mjs
